name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime access lint
        run: npm run lint:runtime

      - name: Build
        run: npm run build

      - name: Test
        run: |
          status=0
          for f in tests/*.test.ts; do
            echo "::group::$f"
            if ! npx tsx "$f"; then
              echo "::error file=$f::test failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
